[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analise_quant*"]
exclude = ["output*", "tests*"]

[project]
name = "analise-quant"
version = "0.1.0"
description = "Plataforma modular de análise quantitativa de investimentos — Bovespa"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
analise-quant = "analise_quant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
